name: N11 central49 five LOSS7 and refuting WIN7 terminal proofs

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/n11-central49-five-loss7-terminal.yml
      - research/experiments/n11-central-19-cover-20261031/generate_five_terminal_loss7.cpp
      - research/experiments/n11-central-19-cover-20261031/verify_five_terminal_loss7.py
      - research/experiments/n11-central-19-cover-20261031/verify_five_loss7_eight_parent_lift.py
      - research/experiments/n11-central-19-cover-20261031/verify_focus_s6_win_refutation.py

jobs:
  terminal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic strategy generator
        run: |
          g++ -std=c++20 -O3 -Wall -Wextra \
            research/experiments/n11-central-19-cover-20261031/generate_five_terminal_loss7.cpp \
            -o "$RUNNER_TEMP/n11-s7-generate"
      - name: Generate five fixed S7 strategies (bounded, not a giant root)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n11-certs"
          for root in \
            00000000000000203808000000000120 \
            0000000000000020380a000000004000 \
            00000000000000a03808100000000000 \
            00000000000002043800800000040000 \
            00000000000200801082008100000000; do
            "$RUNNER_TEMP/n11-s7-generate" "$root" \
              "$RUNNER_TEMP/n11-certs/n11_s7_$root.cert"
          done
      - name: Independent 4x4 Bareiss terminal audit and negative tests
        run: |
          python3 research/experiments/n11-central-19-cover-20261031/verify_five_terminal_loss7.py \
            "$RUNNER_TEMP/n11-certs" --self-test
      - name: Independently lift five certified LOSS7 strategies through their LOSS8 first moves
        run: |
          python3 research/experiments/n11-central-19-cover-20261031/verify_five_loss7_eight_parent_lift.py \
            "$RUNNER_TEMP/n11-certs" --negative > "$RUNNER_TEMP/n11-certs/eight-parent-lift.json"
          python3 - "$RUNNER_TEMP/n11-certs/eight-parent-lift.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert (d["source_terminal_loss7_roots"], d["distinct_certified_loss8_children"],
                  d["all_7_parent_edges_checked"], d["distinct_certified_loss7_by_parent_lift"],
                  d["new_loss7_classes_from_lift"]) == (5, 3, 40, 23, 18)
          assert (d["current_conditional_s7_classes"], d["current_secured_loss7_classes"],
                  d["previously_secured_by_k0637"], d["new_current_secured_loss7_classes"],
                  d["current_secured_s6_to_s7_edges"], d["current_secured_s6_witnesses"],
                  d["current_not_secured_by_this_lift"]) == (2301, 6, 4, 2, 6, 3, 2295)
          assert d["new_current_hits"] == {
              "0000000000000020380a000000000040": [
                  "00000000000000203808000000000040"],
              "00000000000002043800800000000010": [
                  "00000000000000203808000000000040"],
          }
          assert d["negative_tests"] == 2
          assert d["s6_outcome"] == d["two_stone_root"] == d["empty_board"] == "UNKNOWN"
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - name: Generate terminal strategy refuting the selected S6 LOSS witness
        run: |
          "$RUNNER_TEMP/n11-s7-generate" 0000000000000020380a100000000000 \
            "$RUNNER_TEMP/n11-certs/n11_s7_0000000000000020380a100000000000.cert" \
            original_first_WIN7
      - name: Independent 4x4 Bareiss WIN7 and S6 WIN6 audit
        run: |
          python3 research/experiments/n11-central-19-cover-20261031/verify_focus_s6_win_refutation.py \
            "$RUNNER_TEMP/n11-certs" --self-test
      - name: Recheck the five roots belong to the historical 1985-S7 frontier
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'research/experiments/n11-central-19-cover-20261031')
          import audit_1985_s7_cache_reuse as audit
          from verify_five_terminal_loss7 import EXPECTED
          result = audit.audit()
          assert set(result['historical_loss7_hit_keys']) == set(EXPECTED)
          assert set(result['focus_historical_loss7_hit_keys']) == {
              '0000000000000020380a000000004000',
              '00000000000000a03808100000000000'
          }
          assert (result['distinct_s7'], result['raw_s7_edges']) == (1985, 2989)
          assert (result['historical_solver_trusted_loss7_hits'],
                  result['historical_solver_trusted_loss7_edge_hits']) == (5, 8)
          print('Five terminal-certified LOSS7 classes cover eight S6->S7 edges.')
          print('Two are children of the selected 60-child focus S6.')
          print('Historical focused S6 is certified WIN; two-stone root and empty board remain UNKNOWN.')
          PY
      - name: Retain reproducible terminal strategy certificates
        uses: actions/upload-artifact@v4
        with:
          name: n11-central49-five-loss7-and-refuting-win7-certificates
          path: ${{ runner.temp }}/n11-certs/*
          retention-days: 90
