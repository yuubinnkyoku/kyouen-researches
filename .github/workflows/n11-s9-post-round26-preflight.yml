name: N11 round26 independent boundary preflight
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round26-replan-20261029/next-plan.json'
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently compare integer geometry for round27 candidates
        run: python research/experiments/n11-s9-post-round26-replan-20261029/preflight_independent.py | tee round26-preflight.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round26-preflight
          path: round26-preflight.json
          retention-days: 14
