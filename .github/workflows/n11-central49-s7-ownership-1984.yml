name: N11 central49 conditional 1984 S7 four-worker ownership audit

on:
  push:
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/conditional_s6_cover_46_balanced_s7_ownership_1984.json'
      - 'research/experiments/n11-central-19-cover-20261031/verify_s7_balanced_ownership_1984.py'
      - '.github/workflows/n11-central49-s7-ownership-1984.yml'
  workflow_dispatch:

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct all S7 keys with independent 4x4 geometry, audit balanced ownership and reject tampering
        run: python3 research/experiments/n11-central-19-cover-20261031/verify_s7_balanced_ownership_1984.py --negative
