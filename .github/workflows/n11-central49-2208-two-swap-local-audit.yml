name: N11 central49 2208-class exact two-swap local audit

on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/verify_central49_2208_two_swap_no_improvement.js'
      - '.github/workflows/n11-central49-2208-two-swap-local-audit.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Independently recompute exact two-swap neighborhood of 2208 cover
        run: node research/experiments/n11-central-19-cover-20261031/verify_central49_2208_two_swap_no_improvement.js
