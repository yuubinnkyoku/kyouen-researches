name: N11 central WIN4-safe cover audit

on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/**'
      - '.github/workflows/n11-central-win4-safe-cover.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify original 19 geometric primal-dual certificates
        run: node research/experiments/n11-central-19-cover-20261031/verify.js
      - name: Verify pinned exact S5 cache and WIN4 exclusions
        run: node research/experiments/n11-central-19-cover-20261031/audit_win4_exclusion.js
      - name: Verify ten WIN4-safe 56-class covers and their lower bounds
        run: node research/experiments/n11-central-19-cover-20261031/verify_win4_safe_56.js
      - name: Audit 19-root S5 dependencies and three proven LOSS4 reuse swaps
        run: node research/experiments/n11-central-19-cover-20261031/audit_s5_dependency_loss4_reuse.js
      - name: Verify nine WIN4-safe 31-class covers and their lower bounds
        run: node research/experiments/n11-central-19-cover-20261031/verify_win4_safe_31.js
      - name: Verify central-49 31-class cover with three reused LOSS4 boundaries
        run: node research/experiments/n11-central-19-cover-20261031/verify_31_loss4_reuse_49.js
      - name: Search exact-size repairs for five 31-class covers
        run: node research/experiments/n11-central-19-cover-20261031/repair_31.js
      - name: Audit dual-tight matching feasibility for all nine 31-class roots
        run: node research/experiments/n11-central-19-cover-20261031/audit_dual_matching.js
