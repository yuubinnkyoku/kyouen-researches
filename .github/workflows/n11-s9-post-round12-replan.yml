name: N11 round12 proof-only 64-edge replan
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round12-replan-20261029/replan.js'
      - 'research/experiments/n11-s9-post-round12-replan-20261029/next-plan.json'
      - '.github/workflows/n11-s9-post-round12-replan.yml'
  workflow_dispatch:
jobs:
  replan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify round12 terminal certificate and replan 64 edges
        run: node research/experiments/n11-s9-post-round12-replan-20261029/replan.js > round12-next-plan.json
      - name: Show exact conditional replan
        run: cat round12-next-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: n11-round12-proof-only-64-edge-replan
          path: round12-next-plan.json
