name: N11 post degree-two S9 exact matching
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n11-s5-post-degree2-matching.yml'
      - 'research/experiments/n11-s5-post-degree2-matching-20261027/**'
      - 'research/experiments/n11-s9-degree2-terminal-20261027/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact weighted matching solver
        run: python -m pip install 'networkx==3.4.2'
      - name: Independent terminal proof, candidate census, exact matching
        run: python research/experiments/n11-s5-post-degree2-matching-20261027/verify.py --negative
