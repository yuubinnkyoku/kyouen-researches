name: N11 reply27 13-root class completion

on:
  push:
    paths:
      - ".github/workflows/n11-reply27-class-completion.yml"
      - "research/experiments/n11-frontier-selection-20261005/output/reply27-class-10520971679490899968-completion.csv"
  workflow_dispatch:

jobs:
  solve:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build exact replay solver
        run: |
          c++ -std=c++20 -O3 -DNDEBUG -Icpp/solvers \
            cpp/solvers/kyouen_dfpn_root.cpp -o /tmp/dfpn
      - name: Materialize shard
        run: |
          awk -F, -v s=${{ matrix.shard }} '((NR-1)%4)==s {print}' \
            research/experiments/n11-frontier-selection-20261005/output/reply27-class-10520971679490899968-completion.csv \
            > /tmp/targets.csv
          echo "rows=$(wc -l < /tmp/targets.csv)"
          test -s /tmp/targets.csv
      - name: Cold exact replay
        run: |
          /usr/bin/time -f 'wall_s=%e' -o /tmp/time \
            /tmp/dfpn --n=11 --memo=22 --exact-replay=/tmp/targets.csv --only=5 \
              --exact-replay-budget=15000000 --csv=/tmp/out.csv
          cat /tmp/time
          grep '^replay,' /tmp/out.csv
          ! grep -q '^replay_error,' /tmp/out.csv
      - uses: actions/upload-artifact@v4
        with:
          name: reply27-class-completion-${{ matrix.shard }}
          path: |
            /tmp/targets.csv
            /tmp/out.csv
            /tmp/time

  verify:
    needs: solve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: reply27-class-completion-*
          path: /tmp/proof
          merge-multiple: false
      - name: Verify 13 target verdicts
        run: |
          python - <<'PY'
          import csv,glob,hashlib,json
          expect={}
          path="research/experiments/n11-frontier-selection-20261005/output/reply27-class-10520971679490899968-completion.csv"
          with open(path) as f:
              for r in csv.reader(f):
                  expect[(int(r[3]),int(r[4]))]=int(r[1])
          got={}
          hist={0:0,1:0,2:0}
          nodes=0
          for p in sorted(glob.glob("/tmp/proof/*/out.csv")):
              with open(p) as f:
                  for r in csv.reader(f):
                      if not r or r[0]!="replay": continue
                      key=(int(r[9]),int(r[10]))
                      v=int(r[6]); n=int(r[7])
                      if key not in expect:
                          raise SystemExit(f"unexpected key {key}")
                      old=got.get(key)
                      if old is not None and old!=v:
                          raise SystemExit(f"verdict conflict {key}: {old} vs {v}")
                      got[key]=v
                      hist[v]+=1
                      nodes+=n
          missing=set(expect)-set(got)
          assert not missing, missing
          assert len(got)==13, len(got)
          verdict="WIN" if hist[1] else ("LOSS" if hist[2]==13 else "UNKNOWN")
          print("CLASS_COMPLETION_COUNTS",hist)
          print("CLASS_COMPLETION_TOTAL_NODES",nodes)
          print("CLASS_COMPLETION_S4_VERDICT",verdict)
          with open("/tmp/verified.txt","w") as f:
              f.write(f"class=10520971679490899968:0\n")
              f.write(f"coverage=59,61,93\n")
              f.write(f"known_loss_before=39\n")
              f.write(f"new_counts={hist}\n")
              f.write(f"new_nodes={nodes}\n")
              f.write(f"s4_verdict={verdict}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reply27-class-completion-proof
          path: /tmp/verified.txt
