name: N11 round18 proof-only WIN8 lift
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round17-round18-20261029/lift.js'
      - 'research/experiments/n11-s9-post-round17-round18-20261029/lift.json'
      - '.github/workflows/n11-s9-post-round17-round18-lift.yml'
  workflow_dispatch:
jobs:
  lift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently verify round18 terminal witnesses then lift certified WIN8
        run: node research/experiments/n11-s9-post-round17-round18-20261029/lift.js > round18-lift.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round18-lift
          path: round18-lift.json
          retention-days: 14
