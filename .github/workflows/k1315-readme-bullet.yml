name: K1315 README bullet append

# Appends the K1315 bullet (below-band row-3 observation packet, K item 10336390)
# to research/knowledge/README.md. Append-only, fail-closed design:
#   1. bullet embedded as base64; decoded and sha256-gated (baa079b0...)
#   2. marker gate: no-op if K1315-belowband-row3-collapse already present
#   3. README pre-append sha256 gate 28d4fe82... (aborts if changed concurrently)
#   4. appended tail must equal bullet sha256 exactly, then commit
#   5. rebase onto origin/main before push (race-safe with hourly lanes)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/k1315-readme-bullet.yml"

permissions:
  contents: write

jobs:
  append-bullet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      K1315_BULLET_B64: ""
      K1315_BULLET_SHA256: "baa079b0afe116ee1639e7cc3382b8fc0434c53c1a281c96b898a0008f7b2fed"
      K1315_BULLET_BYTES: "7197"
      K1315_README_PRE_SHA256: "28d4fe827c78204b175e0131a6e0f0eaaf65a22b6e206163f5a32d68c8e473e4"
    steps:
      - uses: actions/checkout@v4
      - name: Decode bullet and sha256 gate (fail-closed)
        run: |
          printf '%s' "$K1315_BULLET_B64" | base64 -d > /tmp/bullet.md
          wc -c /tmp/bullet.md
          echo "$K1315_BULLET_SHA256  /tmp/bullet.md" | sha256sum -c -
      - name: Marker idempotency gate
        id: gate
        run: |
          if grep -q "K1315-belowband-row3-collapse" research/knowledge/README.md; then
            echo "K1315 marker already present in README; no-op"
            echo "append=false" >> "$GITHUB_OUTPUT"
          else
            echo "append=true" >> "$GITHUB_OUTPUT"
          fi
      - name: README pre-append sha256 gate (fail-closed on concurrent edit)
        if: steps.gate.outputs.append == 'true'
        run: |
          sha256sum research/knowledge/README.md
          echo "$K1315_README_PRE_SHA256  research/knowledge/README.md" | sha256sum -c -
      - name: Append bullet (tail-verified)
        if: steps.gate.outputs.append == 'true'
        run: |
          if [ -n "$(tail -c 1 research/knowledge/README.md)" ]; then
            printf '\n' >> research/knowledge/README.md
            echo "added missing trailing newline"
          fi
          cat /tmp/bullet.md >> research/knowledge/README.md
          tail -c "$K1315_BULLET_BYTES" research/knowledge/README.md > /tmp/tail.md
          echo "$K1315_BULLET_SHA256  /tmp/tail.md" | sha256sum -c -
          echo "post-append README sha256:"
          sha256sum research/knowledge/README.md
      - name: Commit and push (race-safe)
        if: steps.gate.outputs.append == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/knowledge/README.md
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "K1315 README bullet: below-band row-3 observation packet (append-only, sha-gated, marker-idempotent; K item 10336390)"
          git fetch --unshallow origin main || git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
