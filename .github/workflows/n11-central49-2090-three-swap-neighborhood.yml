name: N11 central49 2090 exact three-swap terminal-preserving audit

on:
  push:
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/audit_central49_2090_three_swap_neighborhood.py'
      - '.github/workflows/n11-central49-2090-three-swap-neighborhood.yml'
  workflow_dispatch:

jobs:
  exact-2090-three-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Independently audit terminal-gated 2090 and all three-witness replacements
        run: |
          set -euo pipefail
          python3 research/experiments/n11-central-19-cover-20261031/audit_central49_2090_three_swap_neighborhood.py > "$RUNNER_TEMP/n11-2090-three-swap.json"
          python3 - "$RUNNER_TEMP/n11-2090-three-swap.json" <<'PY'
          import json, sys
          raw = open(sys.argv[1], encoding="utf-8").read()
          d = json.loads(raw.splitlines()[-1])
          assert d["baseline_distinct_s7"] == 2090
          assert d["baseline_certified_loss7"] == 6
          assert d["removed_triples"] == 15180
          assert d["six_vertex_matchings"] == 227700
          assert d["candidate_combinations"] == (
              d["geometrically_feasible_nontrivial"] +
              d["rejected_nontrivial_or_exceptional"])
          assert d["geometrically_feasible_nontrivial"] == (
              d["excluded_certified_win6"] + d["excluded_known_win7"] +
              d["excluded_lost_certified_loss7"] + d["valid_nontrivial"])
          assert d["best_distinct_s7"] <= 2090
          assert set(d["outcomes"].values()) == {"UNKNOWN"}
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
