name: N11 central49 repaired 1980 S7 conditional certificate audit

on:
  push:
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/conditional_s6_cover_46_repaired_1980_swaps.txt'
      - 'research/experiments/n11-central-19-cover-20261031/verify_repaired_s6_1980.py'
      - '.github/workflows/n11-central49-repaired-s6-1980-audit.yml'
  workflow_dispatch:

jobs:
  independent-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Recompute 94-parent cover and all 18 S6-to-S7 frontiers
        run: |
          python3 research/experiments/n11-central-19-cover-20261031/verify_repaired_s6_1980.py --negative > "$RUNNER_TEMP/audit.json"
          python3 - "$RUNNER_TEMP/audit.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert (d["s5_covered"], d["s6_witnesses"], d["two_for_two_swaps"]) == (94, 46, 18)
          assert (d["initial_distinct_s7"], d["final_distinct_s7"]) == (2711, 1980)
          assert (d["raw_s7_edges"], d["known_win6_conflicts"], d["known_win7_conflicts"]) == (2972, 0, 0)
          assert d["negative_tests"] == 6 and d["conditional_only"]
          assert d["s6_outcome"] == d["s4_outcome"] == d["two_stone_root_outcome"] == d["empty_board_outcome"] == "UNKNOWN"
          print(json.dumps(d, indent=2))
          PY
