name: N11 one-shot knowledge regeneration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n11-knowledge-refresh-once.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Rebuild generated knowledge and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            uv run --locked python tools/knowledge/check.py
            uv run --locked python -m unittest discover -s tools/knowledge/tests
            uv run --locked python tools/knowledge/build.py
            git rm -f .github/workflows/n11-knowledge-refresh-once.yml
            git add README.md research/knowledge/generated
            git commit -m "docs: regenerate knowledge views for K0633"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
