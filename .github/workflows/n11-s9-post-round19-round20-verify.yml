name: N11 round20 independent terminal verification
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round19-round20-20261029/certificate.json'
      - 'research/experiments/n11-s9-post-round19-round20-20261029/verify_compact.js'
      - '.github/workflows/n11-s9-post-round19-round20-verify.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently replay all round20 WIN children and LOSS witnesses
        run: node research/experiments/n11-s9-post-round19-round20-20261029/verify_compact.js --negative
