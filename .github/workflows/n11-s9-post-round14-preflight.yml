name: N11 round15 next-batch independent S10 preflight
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round14-replan-20261029/preflight.js'
      - 'research/experiments/n11-s9-post-round14-replan-20261029/next-plan.json'
      - 'research/experiments/n11-s9-post-round14-replan-20261029/preflight.json'
      - '.github/workflows/n11-s9-post-round14-preflight.yml'
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/experiments/n11-gap6-terminal-20261019
            research/experiments/n11-s9-shared-plan14-eleven-win-20261027
            research/experiments/n11-s9-post-round14-replan-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify both integer geometries and exact 32-root S10 boundaries
        run: node research/experiments/n11-s9-post-round14-replan-20261029/preflight.js
