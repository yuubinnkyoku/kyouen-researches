name: N11 frontier target sample benchmark

# Bench solver changes by updating this workflow explicitly; it is not mandatory CI.

on:
  push:
    paths:
      - ".github/workflows/n11-frontier-bench.yml"
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build n11 df-pn exact replay solver
        run: |
          c++ -std=c++20 -O3 -DNDEBUG -Icpp/solvers cpp/solvers/kyouen_dfpn_root.cpp -o /tmp/dfpn

      - name: Materialize r2=0 and r2=27 target frontiers
        run: |
          python research/experiments/n11-frontier-selection-20261005/scripts/materialize_direct_union_targets.py \
            --out /tmp/r0-all.csv
          python research/experiments/n11-frontier-selection-20261005/scripts/materialize_reply27_targets.py \
            --out /tmp/r27-all.csv
          grep -v '^#' /tmp/r0-all.csv | awk 'NR==1 || NR==1160 || NR==2319' > /tmp/r0-sample.csv
          grep -v '^#' /tmp/r27-all.csv | awk 'NR==1 || NR==1131 || NR==2262' > /tmp/r27-sample.csv
          echo "r0_sample_rows=$(wc -l < /tmp/r0-sample.csv)"
          echo "r27_sample_rows=$(wc -l < /tmp/r27-sample.csv)"

      - name: Cold exact replay samples
        run: |
          /usr/bin/time -f 'r0_process_wall_s=%e' -o /tmp/r0.time \
            /tmp/dfpn --n=11 --memo=22 --exact-replay=/tmp/r0-sample.csv --only=5 \
              --exact-replay-budget=15000000 --csv=/tmp/r0.out
          /usr/bin/time -f 'r27_process_wall_s=%e' -o /tmp/r27.time \
            /tmp/dfpn --n=11 --memo=22 --exact-replay=/tmp/r27-sample.csv --only=5 \
              --exact-replay-budget=15000000 --csv=/tmp/r27.out
          cat /tmp/r0.time /tmp/r27.time
          echo "--- r2=0 sample ---"
          grep '^replay,' /tmp/r0.out
          grep '^# replay_done' /tmp/r0.out
          echo "--- r2=27 sample ---"
          grep '^replay,' /tmp/r27.out
          grep '^# replay_done' /tmp/r27.out
          ! grep -q '^replay_error,' /tmp/r0.out
          ! grep -q '^replay_error,' /tmp/r27.out

      - name: Shared-TT exact replay sample
        run: |
          /usr/bin/time -f 'r27_shared_process_wall_s=%e' -o /tmp/r27-shared.time \
            /tmp/dfpn --n=11 --memo=22 --exact-replay=/tmp/r27-sample.csv --only=5 \
              --exact-replay-budget=15000000 --exact-replay-share-tt --csv=/tmp/r27-shared.out
          cat /tmp/r27-shared.time
          grep '^replay,' /tmp/r27-shared.out
          ! grep -q '^replay_error,' /tmp/r27-shared.out
          python - <<'PY'
          import csv
          def rows(path):
              out={}
              with open(path) as f:
                  for row in csv.reader(f):
                      if row and row[0]=="replay":
                          out[row[1]]=row[6]
              return out
          cold=rows("/tmp/r27.out")
          shared=rows("/tmp/r27-shared.out")
          assert cold == shared, (cold,shared)
          assert len(shared)==3
          print("SHARED_TT_VERDICT_MATCH", shared)
          PY

      - name: S6-only shared exact cache sample
        run: |
          /usr/bin/time -f 'r27_s6share_process_wall_s=%e' -o /tmp/r27-s6share.time \
            /tmp/dfpn --n=11 --memo=22 --exact-replay=/tmp/r27-sample.csv --only=5 \
              --exact-replay-budget=15000000 --exact-share-layer=6 --csv=/tmp/r27-s6share.out
          cat /tmp/r27-s6share.time
          grep '^replay,' /tmp/r27-s6share.out
          grep '^# residual_shadow' /tmp/r27-s6share.out
          ! grep -q '^replay_error,' /tmp/r27-s6share.out
          python - <<'PY'
          import csv
          def rows(path):
              out={}
              with open(path) as f:
                  for row in csv.reader(f):
                      if row and row[0]=="replay":
                          out[row[1]]=row[6]
              return out
          cold=rows("/tmp/r27.out")
          shared=rows("/tmp/r27-s6share.out")
          assert cold == shared, (cold,shared)
          assert len(shared)==3
          print("S6_SHARE_VERDICT_MATCH", shared)
          PY
# rerun after selected-layer cache fix 2026-10-05
