name: N11 S8 plan14 WIN13 independent certificate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n11-s8-plan14-win13.yml'
      - 'research/experiments/n11-s8-plan14-win13-20261026/**'
      - 'research/experiments/n11-s5-pair-cover-20261026/audit_remaining_matching.js'
  workflow_dispatch:
jobs:
  independent-terminal-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Independent 3x3 and 4x4 terminal minimax and mutation rejection
        run: python3 research/experiments/n11-s8-plan14-win13-20261026/verify.py --negative
      - name: Proof-only coverage and conflict audit
        run: node research/experiments/n11-s8-plan14-win13-20261026/audit_plan_progress.js --negative
