name: N11 round27 bounded terminal discovery
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round26-replan-20261029/preflight.json'
  workflow_dispatch:
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded round27 terminal discovery with independent exact geometry
        run: node research/experiments/n11-s9-post-round26-round27-20261029/prove.js | tee round27-discovery.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round27-discovery
          path: round27-discovery.json
          retention-days: 14
