name: N11 round17 independent S9 boundary preflight
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round16-replan-20261029/next-plan.json'
      - 'research/experiments/n11-s9-post-round16-replan-20261029/preflight.js'
      - 'research/experiments/n11-s9-post-round16-replan-20261029/preflight.json'
      - '.github/workflows/n11-s9-post-round16-preflight.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/experiments/n11-gap6-terminal-20261019
            research/experiments/n11-s9-shared-plan14-eleven-win-20261027
            research/experiments/n11-s9-post-round15-round16-20261029
            research/experiments/n11-s9-post-round16-replan-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 20 selected S9 roots and all 526 S10 legal children using two integer geometries
        run: node research/experiments/n11-s9-post-round16-replan-20261029/preflight.js
