name: N11 central49 2092 exact three-swap conditional-cover audit

on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/audit_central49_2092_three_swap.py'
      - '.github/workflows/n11-central49-2092-three-swap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-three-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate all exact three-for-three witness exchanges with integer geometry
        run: python3 research/experiments/n11-central-19-cover-20261031/audit_central49_2092_three_swap.py
