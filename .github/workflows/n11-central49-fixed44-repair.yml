name: N11 central49 fixed-44 two-WIN6 repair audit

on:
  push:
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/conditional_s6_cover_46_after_shared58_win6_repair_2089.json'
      - 'research/experiments/n11-central-19-cover-20261031/verify_shared58_win6_repair_2089.py'
      - '.github/workflows/n11-central49-fixed44-repair.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive repair, independent integer geometry and full terminal replay
        run: python3 research/experiments/n11-central-19-cover-20261031/verify_shared58_win6_repair_2089.py --negative --replay-terminal
