name: N11 central49 post-three-WIN6 2145 conditional repair audit

on:
  push:
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/conditional_s6_cover_46_post_three_win6_repair_2145.json'
      - 'research/experiments/n11-central-19-cover-20261031/verify_central49_post_three_win6_repair_2145.py'
      - '.github/workflows/n11-central49-post-three-win6-repair-2145.yml'
  workflow_dispatch:

jobs:
  independent-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recompute all direct three-witness repairs and S7 obligations using 4x4 integer geometry
        run: |
          python3 research/experiments/n11-central-19-cover-20261031/verify_central49_post_three_win6_repair_2145.py --negative > "$RUNNER_TEMP/repair.json"
          python3 - "$RUNNER_TEMP/repair.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert d["historical_plan_status"] == "SUPERSEDED_BY_CERTIFIED_WIN6"
          assert len(d["removed_certified_win6"]) == 3
          assert (d["known_win6_comparison_classes"], d["known_win7_comparison_classes"]) == (145, 23)
          assert (d["direct_three_replacements"], d["nonconflicting_replacements"]) == (7, 5)
          assert (d["selected_s6"], d["s5_covered"], d["raw_s7_edges"], d["best_direct_repair_distinct_s7"]) == (46, 94, 2983, 2145)
          assert len(d["focus_s7_derived_win6_parents"]) == 7
          assert d["negative_tests"] == 4 and d["conditional_only"]
          assert d["s6_outcome"] == d["s4_outcome"] == d["two_stone_root_outcome"] == d["empty_board_outcome"] == "UNKNOWN"
          print(json.dumps(d, indent=2))
          PY
