name: N11 S9 round-five bounded terminal proof
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n11-s9-n24-round5.yml'
      - 'research/experiments/n11-s9-n24-round5-20261028/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify upstream identity and compute bounded S9 terminal verdicts
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/experiments/n11-s9-n24-round5-20261028
          if test -f "$DIR/compact-certificate.json"; then
            node "$DIR/prove.js" --minimal --negative > /tmp/n11-positive.json
            node "$DIR/prove.js" > /tmp/n11-full.json
            cat /tmp/n11-positive.json
          else
            node "$DIR/prove.js" --propose | tee /tmp/n11-proposed.json
          fi
      - name: Save candidate result for independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n11-s9-round5-result
          path: /tmp/n11-*.json
          if-no-files-found: ignore
