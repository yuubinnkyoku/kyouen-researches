name: N11 round15 bounded S9 terminal discovery
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round14-round15-20261029/prove.js'
      - '.github/workflows/n11-s9-post-round14-round15.yml'
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/experiments/n11-gap6-terminal-20261019
            research/experiments/n11-s9-shared-plan14-eleven-win-20261027
            research/experiments/n11-s9-post-round13-round14-20261029
            research/experiments/n11-s9-post-round14-replan-20261029
            research/experiments/n11-s9-post-round14-round15-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently terminal-solve exactly 32 selected S9 roots
        run: node research/experiments/n11-s9-post-round14-round15-20261029/prove.js > round15-certificate.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round15-discovery
          path: round15-certificate.json
          retention-days: 14
