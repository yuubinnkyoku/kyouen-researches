name: N11 third S8 LOSS terminal certificate
on:
  push:
    paths:
      - 'research/experiments/n11-s8-third-direct-loss-20261030/**'
      - '.github/workflows/n11-s8-third-direct-loss.yml'
  workflow_dispatch:
jobs:
  independent-terminal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Node independent 3x3 and 4x4 integer geometries, 548 full boundary
        shell: bash
        run: |
          set -euo pipefail
          node research/experiments/n11-s8-third-direct-loss-20261030/verify.js --full --negative
      - name: Python independent recursion, 83 LOSS10 and 703 LOSS9 closure
        shell: bash
        run: |
          set -euo pipefail
          python research/experiments/n11-s8-third-direct-loss-20261030/verify.py --full --negative
      - name: Rebuild sealed historical fixed14 frontier and check new LOSS9 edges
        shell: bash
        run: |
          set -euo pipefail
          python research/experiments/n11-s8-third-direct-loss-20261030/lift.py
