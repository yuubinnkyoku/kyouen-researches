name: N11 round19 standalone Python terminal audit
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round18-round19-20261029/verify_python.py'
      - '.github/workflows/n11-s9-post-round18-round19-python.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Replay terminal certificates without Node or shared solver
        run: python3 research/experiments/n11-s9-post-round18-round19-20261029/verify_python.py
