name: N11 round20 proof-only WIN8 lift
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round19-round20-20261029/lift.js'
      - '.github/workflows/n11-s9-post-round19-round20-lift.yml'
  workflow_dispatch:
jobs:
  lift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify round20 terminal witnesses and lift only proven WIN9
        run: node research/experiments/n11-s9-post-round19-round20-20261029/lift.js > round20-lift.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round20-lift
          path: round20-lift.json
          retention-days: 14
