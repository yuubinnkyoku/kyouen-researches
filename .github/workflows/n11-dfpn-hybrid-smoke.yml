name: N11 df-pn hybrid smoke

on:
  # Historical search experiment: run explicitly, never for a layout-only push.
  workflow_dispatch:
jobs:
  hybrid-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build df-pn solver
        run: |
          g++ -std=c++20 -O2 -DNDEBUG cpp/solvers/kyouen_dfpn_root.cpp -o /tmp/dfpn
      - name: 60-second v60 hybrid comparison (L0/20/32/44)
        env:
          D: /tmp/dfpn
          L: /tmp/dfpn-logs
          BUDGET: '60'
          MEMO: '24'
          EXACT_BUDGET: '200000'
          EXACT_RETRIES: '2'
          LEVELS: '0 20 32 44'
        run: |
          bash research/experiments/n11-search-methods/scripts/dfpn_hybrid_probe.sh
