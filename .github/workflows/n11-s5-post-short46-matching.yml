name: N11 post short46 exact matching
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n11-s5-post-short46-matching.yml'
      - 'research/experiments/n11-s5-post-short46-matching-20261027/**'
      - 'research/experiments/n11-s9-short46-terminal-20261027/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact matching library
        run: python -m pip install 'networkx==3.4.2'
      - name: Independent terminal proof and conditional exact matching
        run: python research/experiments/n11-s5-post-short46-matching-20261027/verify.py --negative
