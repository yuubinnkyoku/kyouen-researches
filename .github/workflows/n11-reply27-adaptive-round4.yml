name: N11 reply27 adaptive repair round4

on:
  push:
    paths:
      - ".github/workflows/n11-reply27-adaptive-round4.yml"
  workflow_dispatch:

env:
  BASE: research/experiments/n11-frontier-selection-20261005

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install optimizer dependency
        run: python -m pip install --quiet scipy
      - name: Reoptimize with all persisted reply27 caches
        run: |
          python $BASE/scripts/reply27_selected31_repair.py \
            --extra-s5-cache $BASE/output/reply27-repair-round1-s5.cache \
            --extra-s5-cache $BASE/output/reply27-repair-round2-s5.cache \
            --extra-s5-cache $BASE/output/reply27-repair-round3-s5.cache \
            --extra-s5-cache $BASE/output/reply27-cheap-trio-s5.cache \
            --extra-s5-cache $BASE/output/reply27-tight15-probes-s5.cache \
            --sample-per-class 1 \
            --sample-out /tmp/round4.csv \
            --out /tmp/before.json | tee /tmp/before.log
          grep 'REPLY27_SELECTED31_REPAIR_OK' /tmp/before.log
          python - <<'PY'
          import json
          d=json.load(open("/tmp/before.json"))
          print("ROUND4_BEFORE_CLASS_STATUS",d["class_status_from_derived_cache_plus_manifest"])
          print("ROUND4_BEFORE_SECURED",d["secured_vertices"])
          print("ROUND4_BEFORE_MIN_ADDITIONAL",d["minimum_additional_classes"])
          print("ROUND4_BEFORE_ADDITIVE",
                d["additive_optimum"]["repair_classes"],
                d["additive_optimum"]["additive_unknown_s5"],
                d["additive_optimum"]["unique_unknown_s5"])
          print("ROUND4_PROBES",d["sample_targets"])
          assert d["sample_targets"] >= 1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reply27-round4-prep
          path: |
            /tmp/round4.csv
            /tmp/before.json

  solve:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reply27-round4-prep
          path: /tmp/prep
      - name: Build exact replay solver
        run: |
          c++ -std=c++20 -O3 -DNDEBUG -Icpp/solvers \
            cpp/solvers/kyouen_dfpn_root.cpp -o /tmp/dfpn
      - name: Materialize shard
        run: |
          awk -F, -v s=${{ matrix.shard }} '((NR-1)%4)==s {print}' \
            /tmp/prep/round4.csv > /tmp/targets.csv
          echo "rows=$(wc -l < /tmp/targets.csv)"
      - name: Cold exact replay
        run: |
          if [ ! -s /tmp/targets.csv ]; then
            : > /tmp/out.csv
            echo "empty shard"
            exit 0
          fi
          /usr/bin/time -f 'wall_s=%e' -o /tmp/time \
            /tmp/dfpn --n=11 --memo=22 \
              --exact-replay=/tmp/targets.csv --only=5 \
              --exact-replay-budget=15000000 \
              --csv=/tmp/out.csv
          cat /tmp/time
          grep '^replay,' /tmp/out.csv
          ! grep -q '^replay_error,' /tmp/out.csv
      - uses: actions/upload-artifact@v4
        with:
          name: reply27-round4-${{ matrix.shard }}
          path: |
            /tmp/targets.csv
            /tmp/out.csv

  verify:
    needs: solve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reply27-round4-prep
          path: /tmp/prep
      - uses: actions/download-artifact@v4
        with:
          pattern: reply27-round4-*
          path: /tmp/proof
          merge-multiple: false
      - name: Build conflict-safe round4 cache
        run: |
          python - <<'PY'
          import csv,glob,json
          expect={}
          with open("/tmp/prep/round4.csv") as f:
              for r in csv.reader(f):
                  if r:
                      expect[(int(r[3]),int(r[4]))]=r
          got={}
          hist={0:0,1:0,2:0}
          nodes=0
          for p in glob.glob("/tmp/proof/reply27-round4-[0-3]/out.csv"):
              with open(p) as f:
                  for r in csv.reader(f):
                      if not r or r[0]!="replay": continue
                      k=(int(r[9]),int(r[10])); v=int(r[6]); n=int(r[7])
                      if k not in expect: raise SystemExit(f"unexpected key {k}")
                      old=got.get(k)
                      if old is not None and old!=v:
                          raise SystemExit(f"CONFLICT {k}: {old} vs {v}")
                      got[k]=v; hist[v]+=1; nodes+=n
          if set(got)!=set(expect):
              raise SystemExit(f"missing roots {len(set(expect)-set(got))}")
          with open("/tmp/round4.cache","w") as f:
              f.write("# s5 verdict cache: n=11 schema=1 (reply27 adaptive round4; UNKNOWN omitted)\n")
              for (lo,hi),v in sorted(got.items()):
                  if v in (1,2):
                      f.write(f"s5verdict,{lo},{hi},5,{v},0\n")
          print("ROUND4_COUNTS",hist)
          print("ROUND4_TOTAL_NODES",nodes)
          print("ROUND4_PROVED",sum(v in (1,2) for v in got.values()))
          PY
      - name: Reoptimize after round4
        run: |
          python -m pip install --quiet scipy
          python $BASE/scripts/reply27_selected31_repair.py \
            --extra-s5-cache $BASE/output/reply27-repair-round1-s5.cache \
            --extra-s5-cache $BASE/output/reply27-repair-round2-s5.cache \
            --extra-s5-cache $BASE/output/reply27-repair-round3-s5.cache \
            --extra-s5-cache $BASE/output/reply27-cheap-trio-s5.cache \
            --extra-s5-cache $BASE/output/reply27-tight15-probes-s5.cache \
            --extra-s5-cache /tmp/round4.cache \
            --out /tmp/after.json | tee /tmp/after.log
          grep 'REPLY27_SELECTED31_REPAIR_OK' /tmp/after.log
          python - <<'PY'
          import json
          b=json.load(open("/tmp/prep/before.json"))
          a=json.load(open("/tmp/after.json"))
          print("ROUND4_AFTER_CLASS_STATUS",a["class_status_from_derived_cache_plus_manifest"])
          print("ROUND4_AFTER_SECURED",a["secured_vertices"])
          print("ROUND4_AFTER_MIN_ADDITIONAL",a["minimum_additional_classes"])
          print("ROUND4_AFTER_ADDITIVE",
                a["additive_optimum"]["repair_classes"],
                a["additive_optimum"]["additive_unknown_s5"],
                a["additive_optimum"]["unique_unknown_s5"])
          print("ROUND4_DELTA_WIN_FORBIDDEN",
                a["class_status_from_derived_cache_plus_manifest"]["WIN_forbidden"]
                - b["class_status_from_derived_cache_plus_manifest"]["WIN_forbidden"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reply27-round4-proof
          path: |
            /tmp/round4.cache
            /tmp/after.json
