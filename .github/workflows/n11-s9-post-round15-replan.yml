name: N11 round15 proof-only replan
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round15-replan-20261029/replan.js'
      - 'research/experiments/n11-s9-post-round15-replan-20261029/next-plan.json'
      - 'research/experiments/n11-s9-post-round14-round15-20261029/lift.json'
      - '.github/workflows/n11-s9-post-round15-replan.yml'
  workflow_dispatch:
jobs:
  replan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently verify all prior witnesses and replan remaining 52 edges
        run: node research/experiments/n11-s9-post-round15-replan-20261029/replan.js > round15-replan.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round15-replan
          path: round15-replan.json
          retention-days: 14
