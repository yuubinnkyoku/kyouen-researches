name: N11 central49 2096 repaired focus safe dispatch audit

on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/focus_s7_worker_2096.py'
      - '.github/workflows/n11-central49-2096-focus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Replay repaired cover, prove focused worklist ownership and reject forged reports
        run: |
          set -euo pipefail
          python3 research/experiments/n11-central-19-cover-20261031/focus_s7_worker_2096.py --self-test > "$RUNNER_TEMP/focus2096.txt"
          python3 - "$RUNNER_TEMP/focus2096.txt" <<'PY'
          import json, sys
          d = json.loads(open(sys.argv[1], encoding="utf-8").read().splitlines()[-1])
          assert d["self_test"] == "PASS"
          assert d["total_distinct_s7"] == 2096
          assert d["unverified_focus_s7"] <= 62
          assert d["focus_children"] == d["certified_focus_s7"] + d["unverified_focus_s7"]
          assert sum(d["worker_loads"]) == d["unverified_focus_s7"]
          assert d["tampered_plan_rejected"] == 4
          assert d["bad_receipts_rejected"] == 2
          assert set(d["outcomes"].values()) == {"UNKNOWN"}
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
