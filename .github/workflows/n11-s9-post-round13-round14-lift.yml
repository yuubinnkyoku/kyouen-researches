name: N11 round14 proof-only WIN8 lift
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round13-round14-20261029/lift.js'
      - 'research/experiments/n11-s9-post-round13-round14-20261029/lift.json'
      - '.github/workflows/n11-s9-post-round13-round14-lift.yml'
  workflow_dispatch:
jobs:
  lift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/experiments/n11-gap6-terminal-20261019
            research/experiments/n11-s9-shared-plan14-eleven-win-20261027
            research/experiments/n11-s9-n24-round7-20261028
            research/experiments/n11-s9-post-round8-round9-20261028
            research/experiments/n11-s9-post-round9-round10-20261028
            research/experiments/n11-s9-post-round10-round11-20261028
            research/experiments/n11-s9-post-round11-round12-20261028
            research/experiments/n11-s9-post-round12-round13-20261029
            research/experiments/n11-s9-post-round13-replan-20261029
            research/experiments/n11-s9-post-round13-round14-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently verify terminal witnesses then lift only certified WIN8
        run: node research/experiments/n11-s9-post-round13-round14-20261029/lift.js > round14-lift.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round14-lift
          path: round14-lift.json
          retention-days: 14
