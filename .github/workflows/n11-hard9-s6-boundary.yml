name: N11 hard9 s6 boundary

on:
  push:
    paths:
      - ".github/workflows/n11-hard9-s6-boundary.yml"
      - "research/experiments/n11-frontier-selection-20261005/scripts/materialize_reply27_hard9_s6.py"
  workflow_dispatch:

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build solver
        run: |
          c++ -std=c++20 -O3 -DNDEBUG -Icpp/solvers cpp/solvers/kyouen_dfpn_root.cpp -o /tmp/dfpn
      - name: Materialize hard9 s6 boundary
        run: |
          python research/experiments/n11-frontier-selection-20261005/scripts/materialize_reply27_hard9_s6.py             --out /tmp/hard9-s6.csv --meta-out /tmp/hard9-s6.meta.json
          test "$(wc -l < /tmp/hard9-s6.csv)" -eq 816
      - name: Exact solve hard9 s6 boundary
        run: |
          /usr/bin/time -f 'hard9_s6_wall_s=%e' -o /tmp/hard9-s6.time             /tmp/dfpn --n=11 --memo=22 --exact-replay=/tmp/hard9-s6.csv --only=6               --exact-replay-budget=10000000 --csv=/tmp/hard9-s6.out
          cat /tmp/hard9-s6.time
          ! grep -q '^replay_error,' /tmp/hard9-s6.out
          python - <<'PY'
          import csv,json
          meta=json.load(open("/tmp/hard9-s6.meta.json"))
          parents={tuple(map(int,k.split(":"))):v for k,v in meta["parents"].items()}
          result={}
          hist={0:0,1:0,2:0}
          nodes={0:0,1:0,2:0}
          with open("/tmp/hard9-s6.out") as f:
              for row in csv.reader(f):
                  if not row or row[0]!="replay": continue
                  key=(int(row[9]),int(row[10]))
                  r=int(row[6]); n=int(row[7])
                  old=result.get(key)
                  if old is not None and old!=r:
                      raise SystemExit(f"CONFLICT {key} {old} {r}")
                  result[key]=r
                  hist[r]+=1; nodes[r]+=n
          assert len(result)==816, len(result)
          pchildren=[[] for _ in meta["hard_s5"]]
          for key,ps in parents.items():
              for p in ps: pchildren[p].append(key)
          status=[]
          for i,kids in enumerate(pchildren):
              vals=[result[k] for k in kids]
              if 2 in vals:
                  s="LOSS"
                  witness=kids[vals.index(2)]
              elif all(v==1 for v in vals):
                  s="WIN"; witness=None
              else:
                  s="UNKNOWN"; witness=None
              status.append(s)
              print("HARD_S5_STATUS",i,s,
                    "children",len(kids),
                    "win",sum(v==1 for v in vals),
                    "loss",sum(v==2 for v in vals),
                    "unknown",sum(v==0 for v in vals),
                    "loss_witness",witness)
          print("HARD9_S6_RESULT_COUNTS",hist)
          print("HARD9_S6_NODE_COUNTS",nodes)
          print("HARD9_S5_STATUS_COUNTS",
                {s:status.count(s) for s in ("WIN","LOSS","UNKNOWN")})
          PY
