name: N11 round20 proof-only replan
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round20-replan-20261029/replan.js'
      - '.github/workflows/n11-s9-post-round20-replan.yml'
  workflow_dispatch:
jobs:
  replan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit round20 certificates and select remaining conditional candidates
        run: node research/experiments/n11-s9-post-round20-replan-20261029/replan.js > round20-replan.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round20-replan
          path: round20-replan.json
          retention-days: 14
