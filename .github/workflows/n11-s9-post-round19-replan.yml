name: N11 round19 proof-only replan
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round19-replan-20261029/replan.js'
      - '.github/workflows/n11-s9-post-round19-replan.yml'
  workflow_dispatch:
jobs:
  replan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently audit round19 witnesses and replan remaining conditional edges
        run: node research/experiments/n11-s9-post-round19-replan-20261029/replan.js > round19-replan.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round19-replan
          path: round19-replan.json
          retention-days: 14
