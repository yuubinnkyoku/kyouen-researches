name: K0632 degree-sliced independent audit once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/k0632-degree-sliced-audit-once.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Independent degree-sliced and direct enumeration checks
        run: python research/experiments/modular-substitution-20261102/verify.py
      - run: uv sync --locked
      - run: uv run --locked python tools/knowledge/check.py
      - run: uv run --locked python -m unittest discover -s tools/knowledge/tests
      - run: uv run --locked python tools/knowledge/build.py
      - run: git diff --exit-code -- README.md research/knowledge/generated
      - name: Remove temporary workflow without overwriting concurrent research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git rm -f .github/workflows/k0632-degree-sliced-audit-once.yml
            git commit -m "ci: complete independent K0632 degree-sliced audit"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
