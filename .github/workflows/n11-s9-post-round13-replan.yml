name: N11 round13 proof-only 32-root replan
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round12-round13-20261029/lift.json'
      - 'research/experiments/n11-s9-post-round13-replan-20261029/replan.js'
      - 'research/experiments/n11-s9-post-round13-replan-20261029/next-plan.json'
  workflow_dispatch:
jobs:
  replan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently replay terminal proofs and select bounded S9 candidates
        run: node research/experiments/n11-s9-post-round13-replan-20261029/replan.js > round13-next-plan.json
      - name: Show exact proof-only candidate census
        run: cat round13-next-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: n11-round13-proof-only-replan
          path: round13-next-plan.json
          retention-days: 14
