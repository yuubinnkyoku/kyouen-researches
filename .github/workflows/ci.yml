name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpp:
    name: C++ build and small-certificate checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Compile and self-test 10x10/11x11 root research solvers
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic cpp/solvers/kyouen_solver_10_root.cpp -o /tmp/kyouen_solver_10_root
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic cpp/solvers/kyouen_solver_11_root.cpp -o /tmp/kyouen_solver_11_root
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic cpp/solvers/kyouen_solver_10_f_e_plain.cpp -o /tmp/kyouen_solver_10_f_e_plain
          /tmp/kyouen_solver_10_root --memo-self-test
          /tmp/kyouen_solver_11_root --memo-self-test
          /tmp/kyouen_solver_10_f_e_plain --memo-self-test
          printf 'canonical_parent,move\n"14,64",74\n' > /tmp/root10-regression.csv
          /tmp/kyouen_solver_10_root /tmp/root10-regression.csv 25 | tee /tmp/root10-regression.out
          grep -q '^"14,64",74,WIN,' /tmp/root10-regression.out
      - name: Verify residual micro-kernel semantics
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icpp/solvers cpp/tests/test_kyouen_residual_micro.cpp -o /tmp/test_kyouen_residual_micro
          /tmp/test_kyouen_residual_micro | tee /tmp/residual-micro.out
          grep -q '^VERIFIED clutters=' /tmp/residual-micro.out
      - name: Compile residual n11 integration
        run: c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icpp/solvers cpp/solvers/kyouen_dfpn_root.cpp -o /tmp/kyouen_dfpn_root
      - name: Audit residual transitions on deterministic n11 exact roots
        run: |
          PYTHONPATH=research/experiments/n11-search-methods/scripts python - <<'PY' > /tmp/n11-residual-audit.csv
          from dfpn_edge_classes import legal_after, d4_canonical_key
          base={0,1,2,60}
          for i,z in enumerate(legal_after(base)[:3]):
              lo,hi=d4_canonical_key(base|{z})
              print(f"fixture,{i},5,{lo},{hi},0,0,0,0,0,0")
          PY
          /tmp/kyouen_dfpn_root --n=11 --memo=18 --exact-replay=/tmp/n11-residual-audit.csv --only=5 \
            --exact-replay-budget=200000 --residual-audit-legal=6 --residual-crosscheck-legal=6 --csv=/tmp/n11-residual-audit.out
          ! grep -q '^replay_error,' /tmp/n11-residual-audit.out
          awk '/^# residual_shadow row=/{split($4,a,"="); audit+=a[2]; split($5,b,"="); cross+=b[2]} END{exit !(audit>0 && cross>0)}' /tmp/n11-residual-audit.out
          /tmp/kyouen_dfpn_root --n=11 --memo=18 --exact-replay=/tmp/n11-residual-audit.csv --only=5 \
            --exact-replay-budget=200000 --residual-exact-legal=6 --csv=/tmp/n11-residual-fast.out
          ! grep -q '^replay_error,' /tmp/n11-residual-fast.out
          awk '/^# residual_shadow row=/{split($6,a,"="); exact+=a[2]} END{exit !(exact>0)}' /tmp/n11-residual-fast.out
          /tmp/kyouen_dfpn_root --n=11 --memo=18 --exact-replay=/tmp/n11-residual-audit.csv --only=5 \
            --exact-replay-budget=200000 --residual-exact-legal=6 --residual-share-gate=6 \
            --csv=/tmp/n11-residual-shared.out
          ! grep -q '^replay_error,' /tmp/n11-residual-shared.out
          paste <(grep '^replay,' /tmp/n11-residual-fast.out | cut -d, -f2,7) \
                <(grep '^replay,' /tmp/n11-residual-shared.out | cut -d, -f2,7) | \
            awk -F'[,	]' '{if($1!=$3 || $2!=$4) exit 1; n++} END{exit !(n==3)}'
          awk '/^# residual_shadow row=/{for(i=1;i<=NF;i++){split($i,a,"="); if(a[1]=="shared_hits") hits+=a[2]; if(a[1]=="shared_stores") stores+=a[2]}} END{print "shared_hits=" hits, "shared_stores=" stores; exit !(stores>0)}' /tmp/n11-residual-shared.out
          paste <(grep '^replay,' /tmp/n11-residual-audit.out | cut -d, -f2,7) \
                <(grep '^replay,' /tmp/n11-residual-fast.out | cut -d, -f2,7) | \
            awk -F'[,	]' '{if($1!=$3 || $2!=$4) exit 1; n++} END{exit !(n==3)}'
      - name: Generate and check 1x1 through 6x6
        run: |
          mkdir -p /tmp/kyouen-certs
          for n in 1 2 3 4 5 6; do
            ./build/kyouen-certgen-1-to-8 "$n" "/tmp/kyouen-certs/${n}.cert"
            ./build/kyouen-certcheck "/tmp/kyouen-certs/${n}.cert"
          done
      - name: Run imported research regression checks
        run: |
          python research/experiments/fixed-width/scripts/check_fixed_width_20261003.py
          python research/experiments/geometry/scripts/check_geometry_20261003.py
          python research/experiments/game-structure/scripts/check_game_structure_20261003.py
          python research/experiments/saturation/scripts/check_saturation_20261003.py

  lean:
    name: Lean soundness layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
