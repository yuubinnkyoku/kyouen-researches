name: N11 S7 complete terminal WIN certificate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n11-s7-complete-terminal.yml'
      - 'research/experiments/n11-s7-complete-terminal-20261026/**'
      - 'research/experiments/n11-s9-neighbor23-terminal-20261026/verify.py'
      - 'research/experiments/n11-s9-terminal-neighbor-20261025/verify.py'
      - 'research/experiments/n11-batch-s9-terminal-20261025/verify.py'
      - 'research/experiments/n11-targeted-terminal-lift-20261015/data/all_s7_win_17.txt'
      - 'research/experiments/n11-s4-boundary-direct-20261012/output/current-exact-s5.cache'
      - 'research/experiments/n11-s4-boundary-direct-20261012/output/s5-s6-derived-cache-merge-receipt.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify full S7 AND/OR certificate using independent terminal solvers
        run: python3 research/experiments/n11-s7-complete-terminal-20261026/verify.py --negative
      - name: Audit historical 21 gaps and certified LOSS conflicts
        run: node research/experiments/n11-s7-complete-terminal-20261026/audit.js
      - name: Reject incorrect S7 LOSS to S6 WIN propagation
        run: node research/experiments/n11-s7-complete-terminal-20261026/polarity_audit.js
      - name: Independently audit S7 WIN to S6 WIN and S5 witness-edge lift
        run: python3 research/experiments/n11-s7-complete-terminal-20261026/s6_win_lift_audit.py --negative

      - name: Audit S5 frontier with terminal-only and pinned solver-trusted exclusions
        run: python3 research/experiments/n11-s7-complete-terminal-20261026/s5_proof_only_frontier.py --negative
