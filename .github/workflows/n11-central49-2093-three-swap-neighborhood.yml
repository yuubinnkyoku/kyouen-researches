name: N11 central49 2093 exact three-swap neighborhood audit

on:
  push:
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/audit_central49_2093_three_swap_neighborhood.py'
      - '.github/workflows/n11-central49-2093-three-swap-neighborhood.yml'
  workflow_dispatch:

jobs:
  exact-2093-neighborhood:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Audit all exact three-witness exchanges from the terminal-gated 2093 plan
        run: |
          set -euo pipefail
          python3 research/experiments/n11-central-19-cover-20261031/audit_central49_2093_three_swap_neighborhood.py > "$RUNNER_TEMP/n11-2093-three-swap.json"
          python3 - "$RUNNER_TEMP/n11-2093-three-swap.json" <<'PY'
          import json, sys
          raw = open(sys.argv[1], encoding="utf-8").read()
          d = json.loads(raw.splitlines()[-1])
          assert d["baseline_distinct_s7"] == 2093
          assert d["removed_triples"] == 15180
          assert d["six_vertex_matchings"] == 227700
          assert d["candidate_combinations"] == (d["geometrically_feasible_nontrivial"] +
                  d["rejected_nontrivial_or_exceptional"])
          assert d["geometrically_feasible_nontrivial"] == (
                  d["excluded_certified_win6"] + d["excluded_known_win7"] +
                  d["valid_nontrivial"])
          assert d["best_distinct_s7"] <= 2093
          assert set(d["outcomes"].values()) == {"UNKNOWN"}
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
