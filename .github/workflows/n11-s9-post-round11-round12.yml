name: N11 round12 bounded S9 terminal discovery
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round11-round12-20261028/prove.js'
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/experiments/n11-gap6-terminal-20261019
            research/experiments/n11-s9-shared-plan14-eleven-win-20261027
            research/experiments/n11-s9-post-round10-round11-20261028
            research/experiments/n11-s9-post-round11-replan-20261028
            research/experiments/n11-s9-post-round11-round12-20261028
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently terminal-solve selected S9 roots with two integer geometries
        run: node research/experiments/n11-s9-post-round11-round12-20261028/prove.js > round12-certificate.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round12-discovery
          path: round12-certificate.json
          retention-days: 14
