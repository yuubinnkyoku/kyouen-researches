name: N11 round17 bounded S9 terminal discovery
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round16-round17-20261029/prove.js'
      - '.github/workflows/n11-s9-post-round16-round17.yml'
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/experiments/n11-gap6-terminal-20261019
            research/experiments/n11-s9-shared-plan14-eleven-win-20261027
            research/experiments/n11-s9-post-round15-round16-20261029
            research/experiments/n11-s9-post-round16-replan-20261029
            research/experiments/n11-s9-post-round16-round17-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exactly 20 selected S9 roots using two integer terminal geometries
        run: node research/experiments/n11-s9-post-round16-round17-20261029/prove.js > round17-certificate.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round17-discovery
          path: round17-certificate.json
          retention-days: 14
