name: N11 post 24-child exact conditional matching
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n11-s5-post-n24-matching.yml'
      - 'research/experiments/n11-s5-post-n24-matching-20261028/**'
  workflow_dispatch:
concurrency:
  group: n11-post-n24-matching-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matching library
        run: python -m pip install 'networkx==3.4.2'
      - name: Recompute exact matching and independent alternating-cycle check
        run: python research/experiments/n11-s5-post-n24-matching-20261028/verify.py --negative
