name: N11 central49 1994 conditional S7 independent 4x4 audit

on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/verify_central49_1994_three_swap.py'
      - '.github/workflows/n11-central49-1994-independent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-4x4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Independently replay both three-swap steps and validate 1994 distinct S7 classes
        run: python3 research/experiments/n11-central-19-cover-20261031/verify_central49_1994_three_swap.py
