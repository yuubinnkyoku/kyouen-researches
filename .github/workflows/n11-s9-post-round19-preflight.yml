name: N11 round20 independent boundary preflight
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round19-replan-20261029/next-plan.json'
      - 'research/experiments/n11-s9-post-round19-replan-20261029/preflight.json'
      - 'research/experiments/n11-s9-post-round19-replan-20261029/preflight_independent.py'
      - '.github/workflows/n11-s9-post-round19-preflight.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Independently audit nine round20 roots using 3x3 and 4x4 integer determinants
        run: python3 research/experiments/n11-s9-post-round19-replan-20261029/preflight_independent.py
