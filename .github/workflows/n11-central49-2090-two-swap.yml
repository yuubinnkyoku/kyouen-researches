name: N11 central49 2090 independent two-swap proof audit

on:
  push:
    paths:
      - 'research/experiments/n11-central-19-cover-20261031/verify_central49_2090_two_swap.py'
      - 'research/experiments/n11-central-19-cover-20261031/conditional_s6_cover_46_post_seven_win6_2090_two_swap.json'
      - '.github/workflows/n11-central49-2090-two-swap.yml'
  workflow_dispatch:

jobs:
  audit-2090:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Replay terminal certificates and independently verify 2090 plan
        run: |
          set -euo pipefail
          python3 research/experiments/n11-central-19-cover-20261031/verify_central49_2090_two_swap.py --negative > "$RUNNER_TEMP/n11-2090-audit.txt"
          python3 - "$RUNNER_TEMP/n11-2090-audit.txt" <<'PY'
          import json, sys
          d = json.loads(open(sys.argv[1], encoding="utf-8").read().splitlines()[-1])
          assert d["source_distinct_s7"] == 2091
          assert d["final_distinct_s7"] == 2090
          assert d["saved_distinct_s7"] == 1
          assert d["selected_s6"] == 46 and d["covered_s5"] == 94
          assert d["known_win6_conflicts"] == d["known_win7_conflicts"] == 0
          assert d["negative_tests"] == 8
          assert d["raw_s7_edges"] == 2983
          assert d["terminal_certified_loss7"] == 6
          assert d["unsecured_by_k0644"] == 2084
          assert set(d["outcomes"].values()) == {"UNKNOWN"}
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
