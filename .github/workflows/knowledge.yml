name: Knowledge integrity
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: python research/experiments/graph-star-second-terminal-degree-20261103/verify.py
      - run: uv run --locked python research/experiments/path-run-coefficients-20261103/verify.py
      - run: uv run --locked python research/experiments/path-terminal-real-roots-20261103/verify.py
      - name: Audit K0568 circuit reduction boundaries
        run: |
          uv run --locked python research/experiments/binary-cube-hyperplane-k6-exact-20261025/verify_small_dimension_circuits.py
          c++ -std=c++17 -O2 -Wall -Wextra research/experiments/binary-cube-hyperplane-k6-exact-20261025/build_k6_circuits.cpp -o /tmp/build_k6_circuits
          if /tmp/build_k6_circuits --cnf 6 /tmp/k6-invalid.cnf; then
            echo "circuit CNF must reject K<7" >&2
            exit 1
          fi
          test ! -e /tmp/k6-invalid.cnf
      - name: Audit all-t minimum-width G=3 witnesses
        run: uv run --locked python research/experiments/vertical-fiber-all-t-minwidth-witness-20261116/verify_minwidth_witness.py
      - name: Audit K0832 two-token z=0 residual slice
        run: uv run --locked python research/experiments/vertical-fiber-two-token-z0-slice-20261116/verify_z0_slice.py
      - name: Audit K0832 two-token z=1 residual slice
        run: uv run --locked python research/experiments/vertical-fiber-two-token-z1-slice-20261116/verify_z1_slice.py
      - name: Audit K0832 two-token z=2 residual slice
        run: uv run --locked python research/experiments/vertical-fiber-two-token-z2-slice-20261116/verify_z2_slice.py
      - name: Audit K0832 two-token z=3 residual slice
        run: uv run --locked python research/experiments/vertical-fiber-two-token-z3-slice-20261116/verify_z3_slice.py
      - name: Audit K0832 two-token z=4 residual slice conjecture
        run: uv run --locked python research/experiments/vertical-fiber-two-token-z4-slice-20261116/verify_z4_conjecture.py
      - name: Audit K0832 two-token z=4 full Grundy theorem
        run: uv run --locked python research/experiments/vertical-fiber-two-token-z4-proof-20261116/verify_z4_proof.py
      - name: Audit K0832 two-token z=5 Grundy-2 locus conjecture
        run: uv run --locked python research/experiments/vertical-fiber-two-token-z5-value2-locus-20261116/verify_z5_value2.py
      - name: Audit K0832 ceiling-token stable 2-position classification
        run: uv run --locked python research/experiments/vertical-fiber-ceiling-stable-2positions-20261116/verify_ceiling.py
      - name: Audit K0832 three-token transient band 2-position conjectures
        run: uv run --locked python research/experiments/vertical-fiber-three-token-transient-band-20261116/verify_transient.py
      - name: Audit K0832 transient band extension (k=1..8, m=9/m=10, even-m unified form)
        run: uv run --locked python research/experiments/vertical-fiber-transient-band-extension-20261116/verify_extension.py
      - name: Audit K0832 diagonal m=11..16 extrapolation (odd family, even mod-4 unified form, all-ones profile)
        run: uv run --locked python research/experiments/vertical-fiber-diagonal-m11-m16-20261116/verify_diag_m11_m16.py
      - run: uv run --locked python tools/knowledge/check.py
      - run: uv run --locked python -m unittest discover -s tools/knowledge/tests
      - run: uv run --locked python research/experiments/graph-star-fixed-q-count-complexity-20261102/verify.py
      - run: uv run --locked python research/experiments/graph-star-q-spectrum-20261102/verify.py
      - run: uv run --locked python research/experiments/graph-star-vertex-cover-terminal-gap-20261103/verify.py
      - run: uv run --locked python research/experiments/graph-star-leaf-core-spectrum-20261103/verify.py
      - run: uv run --locked python research/experiments/graph-star-connected-kernel-20261103/verify.py
      - run: uv run --locked python research/experiments/graph-star-fixed-defect-bit-fpt-20261103/verify.py
      - run: uv run --locked python tools/knowledge/build.py
      - run: git diff --exit-code -- README.md research/knowledge/generated
