name: N11 reply27 next8 hard s6 boundary

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize complete s6 boundary
        run: |
          python research/experiments/n11-boundary-recovery-20261006/scripts/materialize_s6_boundary.py \
            --parent-lo-hi 1729382261213626368:536870912 \
            --out /tmp/boundary.csv --meta-out /tmp/meta.json \
            --probe-out /tmp/probes.csv --probes-per-parent 0
          python - <<'PY'
          import csv,json
          d=json.load(open("/tmp/meta.json"))
          n=d["complete_boundary_count"]
          rows=list(csv.reader(open("/tmp/boundary.csv")))
          assert len(rows)==n
          print("NEXT8_HARD_S6_BOUNDARY",n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reply27-next8-hard-s6-input
          path: |
            /tmp/boundary.csv
            /tmp/meta.json

  solve:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reply27-next8-hard-s6-input
          path: /tmp/input
      - name: Build solver
        run: |
          c++ -std=c++20 -O3 -DNDEBUG -Icpp/solvers \
            cpp/solvers/kyouen_dfpn_root.cpp -o /tmp/dfpn
      - name: Materialize shard
        run: |
          awk -v s=${{ matrix.shard }} '((NR-1)%8)==s {print}' /tmp/input/boundary.csv > /tmp/targets.csv
          test -s /tmp/targets.csv
      - name: Exact s6 replay
        run: |
          /usr/bin/time -f 'wall_s=%e' -o /tmp/time \
            /tmp/dfpn --n=11 --memo=22 --exact-replay=/tmp/targets.csv --only=6 \
              --exact-replay-budget=10000000 --exact-order=count --csv=/tmp/out.csv
          cat /tmp/time
          grep '^replay,' /tmp/out.csv
          ! grep -q '^replay_error,' /tmp/out.csv
      - uses: actions/upload-artifact@v4
        with:
          name: reply27-next8-hard-s6-${{ matrix.shard }}
          path: |
            /tmp/targets.csv
            /tmp/out.csv
            /tmp/time

  verify:
    needs: solve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reply27-next8-hard-s6-input
          path: /tmp/input
      - uses: actions/download-artifact@v4
        with:
          pattern: reply27-next8-hard-s6-*
          path: /tmp/proof
          merge-multiple: false
      - name: Verify complete boundary and parent propagation
        run: |
          python - <<'PY'
          import csv,glob,json,sys
          sys.path.insert(0,"research/experiments/n11-boundary-recovery-20261006/scripts")
          import materialize_s6_boundary as M
          parent=(1729382261213626368,536870912)
          assert M.checked_key(parent,5)==parent
          meta=json.load(open("/tmp/input/meta.json"))
          expected={tuple(x["key"]) for x in meta["canonical_children"]}
          assert meta["parent_keys"]==[list(parent)]
          replay={}; hist={0:0,1:0,2:0}; nodes=0
          for p in sorted(glob.glob("/tmp/proof/reply27-next8-hard-s6-[0-7]/out.csv")):
              with open(p,newline="") as f:
                  for r in csv.reader(f):
                      if not r or r[0]!="replay": continue
                      k=(int(r[9]),int(r[10])); v=int(r[6]); n=int(r[7])
                      if k not in expected: raise SystemExit(f"unexpected {k}")
                      old=replay.get(k)
                      if old is not None and old!=v: raise SystemExit(f"CONFLICT {k}")
                      replay[k]=v; hist[v]+=1; nodes+=n
          assert set(replay)==expected,(len(replay),len(expected))
          # Independently regenerate every canonical child from board geometry.
          ppts=set(M.points_from_key(parent))
          regen=set()
          for z in M.legal_after(ppts):
              k=tuple(M.d4_canonical_key([*ppts,z]))
              M.checked_key(k,6)
              regen.add(k)
          assert regen==expected
          status="LOSS" if hist[2] else ("WIN" if hist[0]==0 and hist[1]==len(expected) else "UNKNOWN")
          witness=next((k for k,v in replay.items() if v==2),None)
          out={"parent":list(parent),"children":len(expected),"counts":hist,
               "nodes":nodes,"status":status,
               "loss_witness":list(witness) if witness else None,
               "unknown":[list(k) for k,v in replay.items() if v==0],
               "conflicts":0,"geometry_regeneration":"passed"}
          json.dump(out,open("/tmp/result.json","w"),indent=2,sort_keys=True)
          print("NEXT8_HARD_S5",json.dumps(out,sort_keys=True))
          if status=="LOSS":
              with open("/tmp/derived-s5.cache","w") as f:
                  f.write("# s5 verdict cache: n=11 schema=1 (next8 hard parent from exact s6 LOSS witness)\n")
                  f.write(f"s5verdict,{parent[0]},{parent[1]},5,2,0\n")
          else:
              open("/tmp/derived-s5.cache","w").write("# no exact parent verdict derived\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reply27-next8-hard-s6-proof
          path: |
            /tmp/result.json
            /tmp/derived-s5.cache
            /tmp/input/meta.json
