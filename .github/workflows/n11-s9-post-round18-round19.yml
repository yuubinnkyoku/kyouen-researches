name: N11 round19 bounded terminal discovery
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round18-round19-20261029/prove.js'
      - '.github/workflows/n11-s9-post-round18-round19.yml'
  workflow_dispatch:
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded 12-root discovery with independent exact geometry
        run: node research/experiments/n11-s9-post-round18-round19-20261029/prove.js > round19-discovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: n11-round19-discovery
          path: round19-discovery.json
          retention-days: 14
