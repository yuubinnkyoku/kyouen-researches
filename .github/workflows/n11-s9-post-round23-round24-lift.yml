name: N11 round24 proof-only WIN8 lift
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round23-round24-20261029/lift.js'
      - '.github/workflows/n11-s9-post-round23-round24-lift.yml'
  workflow_dispatch:
jobs:
  lift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently verify round24 and propagate proven WIN9 to WIN8
        run: node research/experiments/n11-s9-post-round23-round24-20261029/lift.js > round24-lift.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round24-lift
          path: round24-lift.json
          retention-days: 14
