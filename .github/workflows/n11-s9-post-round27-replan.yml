name: N11 round27 proof-only replan
on:
  push:
    branches: [main]
    paths:
      - 'research/experiments/n11-s9-post-round27-replan-20261030/replan.js'
      - 'research/experiments/n11-s9-post-round26-round27-20261029/verify_compact.js'
      - '.github/workflows/n11-s9-post-round27-replan.yml'
  workflow_dispatch:
jobs:
  replan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently replay round27 LOSS9 and select round28 candidates
        run: |
          set -o pipefail
          node research/experiments/n11-s9-post-round27-replan-20261030/replan.js | tee round27-replan.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: n11-round27-replan
          path: round27-replan.json
          retention-days: 14
