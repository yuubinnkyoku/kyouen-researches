          git diff --exit-code -- research/experiments/remo-k-branch-r8-sweep-20261116/output/remo_k_branch_r8_sweep_audit.json
      - name: Audit K0873 two-token z=5 Grundy-one locus conjecture
        run: |
          uv run --locked python research/experiments/vertical-fiber-two-token-z5-value1-locus-20261116/verify_z5_value1.py
          git diff --exit-code -- research/experiments/vertical-fiber-two-token-z5-value1-locus-20261116/output/audit.json
      - name: Audit K0872 three-branch REMO first-loser residue signature
        run: |
          uv run --locked python research/experiments/remo-first-loser-residue-signature-20261116/verify_first_loser_residue_signature.py
          git diff --exit-code -- research/experiments/remo-first-loser-residue-signature-20261116/output/audit.json
      - run: uv run --locked python tools/knowledge/check.py
      - run: uv run --locked python -m unittest discover -s tools/knowledge/tests
      - run: uv run --locked python tools/knowledge/build.py
      - name: Commit generated views if stale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other research lanes may advance main while this job is running.
          # Discard only locally generated views, rebuild from the latest main,
          # and retry a non-fast-forward push without overwriting others.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            uv run --locked python tools/knowledge/check.py
            uv run --locked python -m unittest discover -s tools/knowledge/tests
            uv run --locked python tools/knowledge/build.py
            if git diff --quiet -- README.md research/knowledge/generated; then
              echo "KNOWLEDGE_GENERATED_ALREADY_CURRENT"
              exit 0
            fi
            git add README.md research/knowledge/generated
            git commit -m "docs: refresh generated knowledge views"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; retrying generated view refresh"
          done
          exit 1

