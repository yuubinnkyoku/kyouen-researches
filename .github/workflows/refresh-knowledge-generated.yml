name: Refresh knowledge generated views

on:
  push:
    paths:
      - ".github/workflows/refresh-knowledge-generated.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Audit quantitative circle-density modular checker
        run: python research/experiments/fixed-width/scripts/verify_quantitative_density.py
      - name: Audit prime-avoidance finite checks
        run: python research/experiments/fixed-width/scripts/verify_prime_avoidance.py
      - name: Audit tree graph-star DP
        run: python research/experiments/tree-graph-star-dp-20261101/verify.py
      - name: Audit subdivided-star terminal phase transition
        run: python research/experiments/spider-graph-star-20261101/verify.py
      - name: Audit length-three spider terminal Gaussian theorem
        run: python research/experiments/spider-length-three-20261102/verify.py
      - name: Audit all fixed-length spider terminal Gaussian theorem
        run: python research/experiments/spider-all-arm-lengths-20261102/verify.py
      - name: Audit sparse length-three mixed spider Gaussian threshold
        run: python research/experiments/mixed-spider-critical-20261102/verify.py
      - name: Audit bounded mixed-length spider Gaussian criterion
        run: python research/experiments/bounded-mixed-spider-20261102/verify.py
      - name: Audit unbounded-arm q4 spider Gaussian criterion
        run: python research/experiments/unbounded-spider-gaussian-20261102/verify.py
      - name: Audit one-macroscopic-arm Gaussian coalescence
        run: python research/experiments/macroscopic-spider-arm-20261102/verify.py
      - name: Audit unrestricted-arm spider Gaussian sufficiency
        run: python research/experiments/spider-uniform-clt-20261102/verify.py
      - name: Audit sharp unrestricted mixed spider Gaussian criterion
        run: python research/experiments/arbitrary-spider-sharp-clt-20261102/verify.py
      - name: Audit pseudoforest terminal polynomial transfer theorem
        run: python research/experiments/pseudoforest-terminal-dp-20261102/verify.py
      - name: Audit vertex-cover terminal polynomial and K2m phase transition
        run: python research/experiments/vertex-cover-terminal-dp-20261102/verify.py
      - name: Audit bounded-treewidth terminal polynomial and ladder family
        run: python research/experiments/treewidth-terminal-dp-20261102/verify.py
      - name: Audit complete multipartite terminal polynomial
        run: python research/experiments/multipartite-terminal-20261102/verify.py
      - name: Audit bounded-edge-edited multipartite terminal polynomial
        run: python research/experiments/multipartite-edge-edits-20261102/verify.py
      - name: Audit cograph cotree terminal polynomial
        run: python research/experiments/cograph-terminal-20261102/verify.py
      - name: Audit bounded-arity modular substitution terminal polynomial
        run: python research/experiments/modular-substitution-20261102/verify.py
      - name: Audit all-q weighted terminal totals for modular substitution
        run: python research/experiments/modular-substitution-20261102/verify_weighted_total.py
      - name: Audit amortized substitution-tree LCA charging
        run: python research/experiments/modular-substitution-20261102/verify_amortized.py
      - name: Audit graph-star terminal count #P-hardness reduction
        run: python research/experiments/graph-star-count-complexity-20261102/verify.py
      - name: Audit polynomial-bit integer graph-star realization and geometric counting
        run: python research/experiments/graph-star-polynomial-coordinates-20261102/verify.py
      - name: Audit fixed-q>=5 graph-star counting #P-hardness interpolation
        run: python research/experiments/graph-star-fixed-q-count-complexity-20261102/verify.py
      - name: Audit K0643 q-invariant terminal offsets and parity
        run: python research/experiments/graph-star-q-spectrum-20261102/verify.py
      - name: Audit K0645 vertex-cover upper terminal gap
        run: python research/experiments/graph-star-vertex-cover-terminal-gap-20261103/verify.py
      - name: Audit K0647 forest dominating-component and subset-sum terminal spectra
        run: python research/experiments/forest-terminal-spectrum-20261103/verify.py
      - name: Audit K0648 leaf-core terminal spectrum and degree-two gap
        run: python research/experiments/graph-star-leaf-core-spectrum-20261103/verify.py
      - name: Audit improved fixed-defect connected-kernel terminal counting
        run: python research/experiments/graph-star-connected-kernel-20261103/verify.py
      - name: Audit FPT fixed-defect graph-star terminal coefficient
        run: python research/experiments/graph-star-fixed-defect-fpt-20261103/verify.py
      - name: Audit K0655 first positive terminal degree theorem
        run: python research/experiments/graph-star-second-terminal-degree-20261103/verify.py
      - name: Audit K0656 cycle-run terminal closed coefficient formula
        run: python research/experiments/cycle-terminal-run-formula-20261103/verify.py
      - name: Audit K0664 path terminal real-rootedness and weighted tilings
        run: python research/experiments/path-terminal-real-roots-20261103/verify.py
      - name: Audit circle-strip P(w) subadditivity table
        run: uv run --locked python research/experiments/circle-strip-subadditivity-20261114/verify.py
      - name: Audit N11 S2 incremental WIN7 reuse against saved result
        run: |
          uv run --locked python research/experiments/n11-s2-5960-ms5-s7-reuse-20261113/scripts/audit_incremental_class2_win7_reuse.py --output /tmp/n11-s2-incremental-reuse.json
          python - <<'PY'
          import json
          generated = json.load(open("/tmp/n11-s2-incremental-reuse.json"))
          saved = json.load(open("research/experiments/n11-s2-5960-ms5-s7-reuse-20261113/output/class2-win7-reuse-incremental-20261114.json"))
          assert saved["checks"]["worklist_unique"] is True
          checks = [
              "worklist_rows", "total_legal_child_cost", "baseline_win7_roots",
              "baseline_loss7_roots", "baseline_win_loss_conflicts", "new_win7_roots",
              "new_roots_already_in_baseline_win7",
              "new_roots_conflicting_with_baseline_loss7", "new_parent_child_pairs",
              "new_unique_worklist_parents", "new_parents_already_covered_by_baseline",
              "baseline_worklist_parent_hits", "incremental_new_worklist_parents",
              "total_worklist_parent_hits_after_union",
              "remaining_worklist_parents_not_closed_by_win7_reuse",
              "baseline_remaining_legal_child_cost", "incremental_legal_child_cost_removed",
              "remaining_legal_child_cost_after_union", "incremental_class_histogram",
              "total_class_histogram_after_union",
          ]
          for key in checks:
              assert generated["checks"][key] == saved["checks"][key], key
          assert generated["checks"]["new_win7_roots_exact_safe_geometry"] == 23
          assert saved["checks"]["new_win7_roots_all_exact_safe"] is True
          assert generated["source_manifest_counts"] == saved["source_manifest_counts"]
          assert generated["new_roots"] == saved["new_roots"]
          generated_parents = generated["new_parent_records"]
          for row in generated_parents:
              row["already_in_baseline"] = row.pop("already_covered_by_baseline")
          assert generated_parents == saved["new_parent_records"]
          assert generated["incremental_parent_hex"] == saved["incremental_parent_hex"]
          print("N11_S2_INCREMENTAL_WIN7_REUSE_MATCH")
          PY
      - run: uv run --locked python tools/knowledge/check.py
      - run: uv run --locked python -m unittest discover -s tools/knowledge/tests
      - run: uv run --locked python tools/knowledge/build.py
      - name: Commit generated views if stale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other research lanes may advance main while this job is running.
          # Discard only locally generated views, rebuild from the latest main,
          # and retry a non-fast-forward push without overwriting others.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            uv run --locked python tools/knowledge/check.py
            uv run --locked python -m unittest discover -s tools/knowledge/tests
            uv run --locked python tools/knowledge/build.py
            if git diff --quiet -- README.md research/knowledge/generated; then
              echo "KNOWLEDGE_GENERATED_ALREADY_CURRENT"
              exit 0
            fi
            git add README.md research/knowledge/generated
            git commit -m "docs: refresh generated knowledge views"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; retrying generated view refresh"
          done
          exit 1

